services:
  cuidarteplus-postgres-ev:
    image: postgres:15-alpine
    container_name: cuidarteplus-postgres-ev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${PORT_POSTGRES:-15442}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./BACKEND/sql/dump-cuidarteplus.sql:/tmp/dump-cuidarteplus.sql:ro
      - ./BACKEND/sql/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cuidarteplus-network
    restart: unless-stopped

  cuidarteplus-backend-ev:
    build:
      context: ./BACKEND
      dockerfile: Dockerfile
    container_name: cuidarteplus-backend-ev
    hostname: cuidarteplus-api
    environment:
      PORT: 4000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@cuidarteplus-postgres-ev:5432/${POSTGRES_DB}
      NODE_ENV: ${NODE_ENV:-production}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET}
      FRONTEND_URL: http://localhost:${PORT_FRONTEND:-3333}
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-10485760}
    ports:
      - "${PORT_BACKEND:-4444}:4000"
    depends_on:
      cuidarteplus-postgres-ev:
        condition: service_healthy
    volumes:
      - ./BACKEND/uploads:/app/uploads
    networks:
      - cuidarteplus-network
    restart: unless-stopped

  cuidarteplus-frontend-ev:
    build:
      context: ./FRONTEND
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "http://localhost:${PORT_BACKEND:-4444}"
    container_name: cuidarteplus-frontend-ev
    hostname: cuidarteplus-web
    ports:
      - "${PORT_FRONTEND:-3333}:8080"
    depends_on:
      cuidarteplus-backend-ev:
        condition: service_started
    networks:
      - cuidarteplus-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  cuidarteplus-network:
    driver: bridge
    name: cuidarteplus-network